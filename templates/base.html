{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="{% if org_membership.dark_mode %}dark{% else %}light{% endif %}"{% if org_membership.accent_theme %} data-accent-theme="{{ org_membership.accent_theme }}"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dojo{% endblock %}</title>
    <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/inter/inter.css' %}" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon/favicon-16x16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/favicon/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'img/favicon/site.webmanifest' %}">
    <style>
        :root {
            --dojo-sidebar: #1E3A5F;
            --dojo-sidebar-dark: #152d4a;
            --dojo-accent: #2563EB;
            --dojo-accent-hover: #1d4ed8;
            --dojo-body-bg: #F1F5F9;
            --dojo-card-bg: #ffffff;
            --dojo-text: #0f172a;
            --dojo-muted: #64748b;
            --dojo-border: #e2e8f0;
            --dojo-radius: 10px;
            --dojo-shadow: 0 1px 3px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
            --dojo-shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05);
        }
        /* Dark mode: <html data-bs-theme="dark">, from the signed-in staff member's
           Appearance setting under My account. Bootstrap 5.3's own components follow
           the attribute; these cover Dojo's --dojo-* colours and the literal-colour
           utilities (.bg-white, .bg-light, .text-dark) used across the templates. */
        :root[data-bs-theme="dark"] {
            --dojo-sidebar: #161616;
            --dojo-sidebar-dark: #080808;
            --dojo-body-bg: #0a0a0a;
            --dojo-card-bg: #171717;
            --dojo-text: #e8e8e8;
            --dojo-muted: #9a9a9a;
            --dojo-border: #2e2e2e;
            --dojo-shadow: 0 1px 3px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.5);
            --dojo-shadow-md: 0 4px 12px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.6);
        }
        [data-bs-theme="dark"] .bg-white { background-color: var(--dojo-card-bg) !important; }
        [data-bs-theme="dark"] .bg-light { background-color: #1c1c1c !important; }
        [data-bs-theme="dark"] .btn-outline-dark { --bs-btn-color: var(--dojo-text); --bs-btn-border-color: #555; --bs-btn-hover-bg: #333; --bs-btn-hover-border-color: #666; --bs-btn-hover-color: #fff; }
        [data-bs-theme="dark"] .table-light { --bs-table-bg: #1f1f1f; --bs-table-color: var(--dojo-muted); --bs-table-border-color: var(--dojo-border); }
        [data-bs-theme="dark"] .text-dark,
        [data-bs-theme="dark"] .text-black { color: var(--dojo-text) !important; }
        /* ...except on the bright warning and info badges (Medical info, Emergency
           contact), which keep their yellow and cyan in dark mode and need dark text. */
        [data-bs-theme="dark"] .bg-warning.text-dark,
        [data-bs-theme="dark"] .bg-info.text-dark { color: #212529 !important; }
        /* A lightly shaded strip inside a card. */
        .dojo-subtle-panel { background: rgba(0,0,0,.02); }
        [data-bs-theme="dark"] .dojo-subtle-panel { background: rgba(255,255,255,.03); }
        /* A card header that needs to stand out, e.g. medical information. */
        .dojo-alert-header { background: #fff5f5; border-bottom-color: #fca5a5 !important; }
        [data-bs-theme="dark"] .dojo-alert-header { background: #2a1214; border-bottom-color: #7f1d1d !important; }
        /* Personal colour themes (Appearance under My account), over the club's own colours.
           html[data-accent-theme] outranks the club's :root colours whatever the order. */
        html[data-accent-theme="blue"]   { --dojo-accent:#2563EB; --dojo-accent-hover:#1d4ed8; --dojo-sidebar:#1E3A5F; --dojo-sidebar-dark:#152d4a; }
        html[data-accent-theme="green"]  { --dojo-accent:#16a34a; --dojo-accent-hover:#15803d; --dojo-sidebar:#14532d; --dojo-sidebar-dark:#052e13; }
        html[data-accent-theme="purple"] { --dojo-accent:#7c3aed; --dojo-accent-hover:#6d28d9; --dojo-sidebar:#3b0764; --dojo-sidebar-dark:#1e0333; }
        html[data-accent-theme="amber"]  { --dojo-accent:#d97706; --dojo-accent-hover:#b45309; --dojo-sidebar:#78350f; --dojo-sidebar-dark:#3f1d05; }
        html[data-accent-theme="rose"]   { --dojo-accent:#e11d48; --dojo-accent-hover:#be123c; --dojo-sidebar:#4c0519; --dojo-sidebar-dark:#27020d; }
        html[data-accent-theme="slate"]  { --dojo-accent:#475569; --dojo-accent-hover:#334155; --dojo-sidebar:#1e293b; --dojo-sidebar-dark:#0f172a; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; color: var(--dojo-text); background: var(--dojo-body-bg); }
        h1,h2,h3,h4,h5,h6 { font-weight: 600; }
        .card { border-radius: var(--dojo-radius) !important; border: 1px solid var(--dojo-border) !important; box-shadow: var(--dojo-shadow) !important; }
        .btn { border-radius: 7px !important; font-weight: 500; font-size: 0.875rem; }
        .btn-primary { background: var(--dojo-accent) !important; border-color: var(--dojo-accent) !important; }
        .btn-primary:hover { background: var(--dojo-accent-hover) !important; border-color: var(--dojo-accent-hover) !important; }
        .btn-dark { background: var(--dojo-sidebar) !important; border-color: var(--dojo-sidebar) !important; }
        .btn-dark:hover { background: var(--dojo-sidebar-dark) !important; border-color: var(--dojo-sidebar-dark) !important; }
        .badge { border-radius: 5px !important; font-weight: 500; }
        .table { font-size: 0.875rem; }
        .table th { font-weight: 600; color: var(--dojo-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: .05em; }
        .form-control, .form-select { border-radius: 7px !important; border-color: var(--dojo-border); font-size: 0.875rem; }
        .form-control:focus, .form-select:focus { border-color: var(--dojo-accent); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
        .alert { border-radius: var(--dojo-radius) !important; }
        /* Mobile baseline */
        @media (max-width: 767px) {
            .card-header.d-flex { flex-wrap: wrap; gap: 8px !important; }
            .card-header.d-flex h6 { min-width: 0; }
            /* dl label/value pairs stack on mobile */
            /* The row's negative gutter margins would pull the now-unpadded text to the card's edge. */
            dl.row { margin-left: 0; margin-right: 0; }
            dl.row dt, dl.row dd { float: none; width: 100%; max-width: 100%; padding: 0; margin: 0; }
            dl.row dd { color: var(--dojo-text); padding-bottom: 10px; }
            dl.row dt { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .05em; padding-top: 6px; }
            dl.row dt:first-child { padding-top: 0; }
            /* Stat tiles on small screens */
            .col-sm-3 { flex: 0 0 50%; max-width: 50%; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}
    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>
    {% if DOJO_DEBUG %}<script src="{% static 'js/dojo-diagnostics.js' %}"></script>{% endif %}
    <script>
    // Tabbed pages (.dojo-tabs): open the tab named in the URL (e.g. #notes after
    // saving one), follow in-page links to a tab, and keep the URL in step.
    (function () {
        const tabFor = key => document.querySelector(`.dojo-tabs [data-section="${key}"]`);
        const showFromHash = () => {
            const tab = tabFor(location.hash.slice(1));
            if (tab) bootstrap.Tab.getOrCreateInstance(tab).show();
        };
        showFromHash();
        window.addEventListener('hashchange', showFromHash);
        document.querySelectorAll('.dojo-tabs [data-section]').forEach(tab => {
            tab.addEventListener('shown.bs.tab', () => history.replaceState(null, '', '#' + tab.dataset.section));
        });
    })();
    </script>
    <script>
    // Charts follow the dark theme.
    if (window.Chart && document.documentElement.dataset.bsTheme === 'dark') {
        Chart.defaults.color = '#c8c8c8';
        Chart.defaults.borderColor = 'rgba(255,255,255,.1)';
    }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
