{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="{% if org_membership.dark_mode %}dark{% endif %}" data-accent-theme="{{ org_membership.accent_theme|default:'' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dojo{% endblock %}</title>
    <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/inter/inter.css' %}" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon/favicon-16x16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/favicon/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'img/favicon/site.webmanifest' %}">
    <style>
        :root {
            --dojo-sidebar: #1E3A5F;
            --dojo-sidebar-dark: #152d4a;
            --dojo-accent: #2563EB;
            --dojo-accent-hover: #1d4ed8;
            --dojo-body-bg: #F1F5F9;
            --dojo-card-bg: #ffffff;
            --dojo-text: #0f172a;
            --dojo-muted: #64748b;
            --dojo-border: #e2e8f0;
            --dojo-radius: 10px;
            --dojo-shadow: 0 1px 3px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
            --dojo-shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05);
        }
        /* Dark mode — set via <html data-bs-theme="dark">, driven by the signed-in
           staff member's own "Appearance" preference (account settings). Bootstrap's
           own components (cards, tables, forms, dropdowns, alerts, badges) pick up
           Bootstrap 5.3's built-in dark variables automatically from this same
           attribute; these overrides just cover Dojo's own custom --dojo-* palette. */
        :root[data-bs-theme="dark"] {
            --dojo-sidebar: #161616;
            --dojo-sidebar-dark: #080808;
            --dojo-body-bg: #0a0a0a;
            --dojo-card-bg: #171717;
            --dojo-text: #e8e8e8;
            --dojo-muted: #9a9a9a;
            --dojo-border: #2e2e2e;
            --dojo-shadow: 0 1px 3px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.5);
            --dojo-shadow-md: 0 4px 12px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.6);
        }
        /* Bootstrap's plain .bg-white/.bg-light utilities are fixed literal colours,
           not theme-aware (unlike .bg-body etc.) — used throughout for card headers
           and light sub-panels, so remap them here rather than in every template. */
        [data-bs-theme="dark"] .bg-white { background-color: var(--dojo-card-bg) !important; }
        [data-bs-theme="dark"] .bg-light { background-color: #1c1c1c !important; }
        /* Subtle shaded panel inside a card (e.g. a "current settings" summary
           strip) — themed instead of a hardcoded light-grey so it never ends
           up light-on-light or, in dark mode, light-text-on-light-bg. */
        .dojo-subtle-panel { background: rgba(0,0,0,.02); }
        [data-bs-theme="dark"] .dojo-subtle-panel { background: rgba(255,255,255,.03); }
        /* .text-dark/.text-black are also plain literal-colour utilities (not
           theme-aware) — used for member-name links in tables across the app. */
        [data-bs-theme="dark"] .text-dark,
        [data-bs-theme="dark"] .text-black { color: var(--dojo-text) !important; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 15px; color: var(--dojo-text); background: var(--dojo-body-bg); }
        h1,h2,h3,h4,h5,h6 { font-weight: 600; }
        .card { border-radius: var(--dojo-radius) !important; border: 1px solid var(--dojo-border) !important; box-shadow: var(--dojo-shadow) !important; }
        .btn { border-radius: 7px !important; font-weight: 500; font-size: 0.875rem; }
        .btn-primary { background: var(--dojo-accent) !important; border-color: var(--dojo-accent) !important; }
        .btn-primary:hover { background: var(--dojo-accent-hover) !important; border-color: var(--dojo-accent-hover) !important; }
        .btn-dark { background: var(--dojo-sidebar) !important; border-color: var(--dojo-sidebar) !important; }
        .btn-dark:hover { background: var(--dojo-sidebar-dark) !important; border-color: var(--dojo-sidebar-dark) !important; }
        .badge { border-radius: 5px !important; font-weight: 500; }
        .table { font-size: 0.875rem; }
        .table th { font-weight: 600; color: var(--dojo-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: .05em; }
        .form-control, .form-select { border-radius: 7px !important; border-color: var(--dojo-border); font-size: 0.875rem; }
        .form-control:focus, .form-select:focus { border-color: var(--dojo-accent); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
        .alert { border-radius: var(--dojo-radius) !important; }
        /* Mobile baseline */
        @media (max-width: 767px) {
            .card-header.d-flex { flex-wrap: wrap; gap: 8px !important; }
            .card-header.d-flex h6 { min-width: 0; }
            /* dl label/value pairs stack on mobile */
            dl.row dt, dl.row dd { float: none; width: 100%; max-width: 100%; padding: 0; margin: 0; }
            dl.row dd { color: var(--dojo-text); padding-bottom: 10px; }
            dl.row dt { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .05em; padding-top: 6px; }
            dl.row dt:first-child { padding-top: 0; }
            /* Stat tiles on small screens */
            .col-sm-3 { flex: 0 0 50%; max-width: 50%; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}
    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>
    {% if DOJO_DEBUG %}<script src="{% static 'js/dojo-diagnostics.js' %}"></script>{% endif %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
