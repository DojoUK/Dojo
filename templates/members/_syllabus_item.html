<form method="post" action="{% url 'member_syllabus_toggle' org_slug=org.slug pk=member.pk item_pk=entry.item.pk %}"
      hx-post="{% url 'member_syllabus_toggle' org_slug=org.slug pk=member.pk item_pk=entry.item.pk %}"
      hx-trigger="change" hx-swap="outerHTML">
    {% csrf_token %}
    <div class="form-check">
        <input type="checkbox" class="form-check-input" id="syllabus-item-{{ entry.item.pk }}"
               {% if entry.done %}checked{% endif %}>
        <label class="form-check-label small {% if entry.done %}text-decoration-line-through text-muted{% endif %}" for="syllabus-item-{{ entry.item.pk }}">
            {{ entry.item.name }}
        </label>
        {% if entry.item.link %}
        <a href="{{ entry.item.link }}" target="_blank" rel="noopener" class="ms-1" title="Open link">
            <i class="bi bi-link-45deg"></i>
        </a>
        {% endif %}
        {% if entry.item.description %}<div class="small text-muted">{{ entry.item.description }}</div>{% endif %}
    </div>
</form>
