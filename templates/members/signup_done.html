{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Application received — {{ org.name }}</title>
    <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon/favicon-32x32.png' %}">
    <link rel="apple-touch-icon" href="{% static 'img/favicon/apple-touch-icon.png' %}">
    <style>body { background: #f8f9fa; }</style>
</head>
<body>
<div class="container py-5 text-center" style="max-width: 480px;">
    <h2 class="fw-bold mb-1">{{ org.name }}</h2>
    <p class="text-muted mb-4">Membership application</p>
    <div class="card border-0 shadow-sm">
        <div class="card-body p-5">
            <i class="bi bi-check-circle-fill text-success display-4 d-block mb-3"></i>
            <h4 class="mb-2">Application received</h4>
            <p class="text-muted mb-0">Thank you! We'll review your application and be in touch soon.</p>
            {% if org.email %}
            <p class="text-muted small mt-2">Any questions? <a href="mailto:{{ org.email }}">{{ org.email }}</a></p>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
