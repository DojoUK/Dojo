{% extends 'signin_base.html' %}
{% block title %}Check your email{% endblock %}
{% block card %}
<i class="bi bi-envelope-check display-5 text-success d-block mb-3"></i>
<h5 class="fw-semibold mb-2" style="font-size:1rem;">Check your email</h5>
<p class="text-muted small mb-3">If an account exists for that address, a password reset link has been sent.</p>
<a href="{% url 'login' %}" class="btn btn-dark w-100 py-2">Back to log in</a>
{% endblock %}
