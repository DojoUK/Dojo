{% extends 'signin_base.html' %}
{% block title %}Reset password{% endblock %}
{% block card %}
<h5 class="fw-semibold mb-1" style="font-size:1rem;">Reset password</h5>
<p class="text-muted small mb-4">Enter your email address and we'll send you a reset link.</p>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label small fw-semibold" for="id_email">Email address</label>
        <input type="email" name="email" id="id_email" class="form-control" autocomplete="email" autofocus required>
    </div>
    <button type="submit" class="btn btn-dark w-100 py-2">Send reset link</button>
</form>
<div class="text-center mt-3">
    <a href="{% url 'login' %}" class="text-muted small">Back to log in</a>
</div>
{% endblock %}
