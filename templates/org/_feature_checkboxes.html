{# Feature switches, shared by the setup wizard and Settings → Features. Expects `feature_rows`. #}
<div data-feature-switches style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.6rem 1.5rem;">
    {% for row in feature_rows %}
    <div class="form-check">
        <input class="form-check-input" type="checkbox" name="features" value="{{ row.key }}"
               id="feature-{{ row.key }}" data-requires="{{ row.requires }}"
               {% if row.enabled %}checked{% endif %}>
        <label class="form-check-label small" for="feature-{{ row.key }}">
            <span class="fw-semibold">{{ row.label }}</span>
            <span class="d-block text-muted" style="font-size:0.75rem;">
                {{ row.help }}
                {% if row.requires_labels %}Needs {{ row.requires_labels|join:" and " }}.{% endif %}
            </span>
        </label>
    </div>
    {% endfor %}
</div>
<script>
(function () {
    // Ticking a feature ticks what it needs; unticking one unticks what needs it.
    var boxes = document.querySelectorAll('[data-feature-switches] input[name="features"]');
    function byKey(key) { return document.getElementById('feature-' + key); }
    boxes.forEach(function (box) {
        box.addEventListener('change', function () {
            if (box.checked) {
                box.dataset.requires.split(' ').filter(Boolean).forEach(function (key) {
                    var needed = byKey(key);
                    if (needed && !needed.checked) { needed.checked = true; needed.dispatchEvent(new Event('change')); }
                });
            } else {
                boxes.forEach(function (other) {
                    if (other.checked && other.dataset.requires.split(' ').indexOf(box.value) !== -1) {
                        other.checked = false; other.dispatchEvent(new Event('change'));
                    }
                });
            }
        });
    });
})();
</script>
