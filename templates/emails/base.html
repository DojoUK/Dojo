<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block subject %}Email{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#f1f5f9;padding:32px 12px;">
  <tr>
    <td align="center">
      <table width="600" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;width:100%;">

        <!-- Header: the club's own colour -->
        <tr>
          <td align="center" style="background:{{ brand_colour|default:'#1E3A5F' }};padding:28px 32px;border-radius:12px 12px 0 0;">
            {% if org_logo_url %}<img src="{{ org_logo_url }}" alt="" height="56" style="display:block;margin:0 auto 12px;max-height:56px;max-width:200px;height:auto;width:auto;border:0;{{ org_logo_backdrop }}">{% endif %}
            <div style="color:#ffffff;font-size:19px;font-weight:700;letter-spacing:-0.2px;">{{ org_name }}</div>
          </td>
        </tr>

        <!-- Body -->
        <tr>
          <td style="background:#ffffff;padding:32px;border-radius:0 0 12px 12px;">
            {% block content %}{% endblock %}
          </td>
        </tr>

        {% include 'emails/_footer.html' %}

      </table>
    </td>
  </tr>
</table>
</body>
</html>
