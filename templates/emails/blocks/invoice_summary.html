<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:{% if overdue %}#fef2f2{% else %}#f9fafb{% endif %};border-radius:8px;border:1px solid {% if overdue %}#fecaca{% else %}#e5e7eb{% endif %};margin-bottom:24px;">
  <tr><td style="padding:20px 24px;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr><td style="color:#6b7280;font-size:13px;padding-bottom:8px;">Member</td><td style="color:#111827;font-size:13px;font-weight:600;text-align:right;padding-bottom:8px;">{{ member_name }}</td></tr>
      <tr><td style="color:#6b7280;font-size:13px;padding-bottom:8px;">Period</td><td style="color:#111827;font-size:13px;text-align:right;padding-bottom:8px;">{{ period }}</td></tr>
      <tr><td style="color:#6b7280;font-size:13px;padding-bottom:8px;">Due date</td><td style="color:{% if overdue %}#dc2626{% else %}#111827{% endif %};font-size:13px;text-align:right;padding-bottom:8px;">{{ due_date }}{% if overdue %} (overdue){% endif %}</td></tr>
      <tr><td style="color:#6b7280;font-size:13px;padding-bottom:8px;">Reference</td><td style="color:#111827;font-size:13px;text-align:right;padding-bottom:8px;font-family:monospace;">{{ reference }}</td></tr>
      <tr><td colspan="2" style="border-top:1px solid #e5e7eb;padding-top:12px;"></td></tr>
      <tr><td style="color:#111827;font-size:17px;font-weight:700;">{% if paid %}Paid{% else %}Amount due{% endif %}</td><td style="color:#111827;font-size:21px;font-weight:700;text-align:right;">{{ amount }}</td></tr>
    </table>
    {% if notes %}<p style="color:#6b7280;font-size:13px;margin:12px 0 0;">{{ notes|linebreaksbr }}</p>{% endif %}
  </td></tr>
</table>
