services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-dojo}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dojo_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000 --insecure
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=${DB_NAME:-dojo}
      - DB_USER=${DB_USER:-dojo_user}
      - DB_PASSWORD=${DB_PASSWORD:-dojo_password}
      - DB_HOST=db
      - DB_PORT=3306
      - DEBUG=${DEBUG:-True}
    depends_on:
      db:
        condition: service_healthy

  stripe:
    image: stripe/stripe-cli:latest
    command: listen --forward-to http://web:8000/stripe/webhook/ --skip-verify
    environment:
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY}
    depends_on:
      - web

volumes:
  mysql_data:
