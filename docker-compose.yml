services:
  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-dojo}
      MYSQL_USER: ${DB_USER:-dojo_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dojo_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dojo_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  web:
    build: .
    entrypoint: /bin/sh
    command: -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000 --insecure"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=${DB_NAME:-dojo}
      - DB_USER=${DB_USER:-dojo_user}
      - DB_PASSWORD=${DB_PASSWORD:-dojo_password}
      - DB_HOST=db
      - DB_PORT=3306
      - DEBUG=${DEBUG:-True}
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    entrypoint: /bin/sh
    command: -c "python manage.py run_scheduler"
    restart: always
    volumes:
      - .:/app
    environment:
      - DB_NAME=${DB_NAME:-dojo}
      - DB_USER=${DB_USER:-dojo_user}
      - DB_PASSWORD=${DB_PASSWORD:-dojo_password}
      - DB_HOST=db
      - DB_PORT=3306
      - DEBUG=${DEBUG:-True}
      - SKIP_MIGRATE=1
    depends_on:
      - db
      - web

  mail:
    image: boky/postfix:5.1.0-alpine
    restart: always
    environment:
      ALLOW_EMPTY_SENDER_DOMAINS: "true"
      POSTFIX_myhostname: ${MAIL_HOSTNAME:-localhost}
    volumes:
      - mail_queue:/var/spool/postfix

  mailpit:
    image: axllent/mailpit:v1.31.2
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025"

  stripe:
    image: stripe/stripe-cli:latest
    command: listen --forward-to ${STRIPE_FORWARD_TO:-http://web:8000/stripe/webhook/} --skip-verify
    environment:
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY}
    depends_on:
      - web

volumes:
  mysql_data:
  mail_queue:
